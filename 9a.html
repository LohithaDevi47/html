<!DOCTYPE html>
<html>
<head>
<title>JavaScript Functions</title>

<script>
function calculate() {

    let n = parseInt(document.getElementById("num").value);
    let output = "";
    function factorial(n) {
        let fact = 1;
        for (let i = 1; i <= n; i++) {
            fact *= i;
        }
        return fact;
    }


    function fibonacci(n) {
        let a = 0, b = 1, c;
        let fib = a + " " + b + " ";
        for (let i = 2; i < n; i++) {
            c = a + b;
            fib += c + " ";
            a = b;
            b = c;
        }
        return fib;
    }

    function isPrime(n) {
        if (n <= 1) return "Not Prime";
        for (let i = 2; i < n; i++) {
            if (n % i == 0) return "Not Prime";
        }
        return "Prime";
    }

 
    function isPalindrome(n) {
        let str = n.toString();
        let rev = str.split("").reverse().join("");
        if (str === rev)
            return "Palindrome";
        else
            return "Not Palindrome";
    }

    output += "Factorial: " + factorial(n) + "<br>";
    output += "Fibonacci: " + fibonacci(n) + "<br>";
    output += "Prime: " + isPrime(n) + "<br>";
    output += "Palindrome: " + isPalindrome(n) + "<br>";

    document.getElementById("result").innerHTML = output;
}
</script>

</head>

<body>

<h2>JavaScript Functions</h2>

Enter Number:
<input type="number" id="num">

<button onclick="calculate()">Calculate</button>

<p id="result"></p>

</body>
</html>
