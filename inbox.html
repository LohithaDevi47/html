<!DOCTYPE html>
<html>
<head>
    <title>Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h3>📩 Inbox</h3>

    {% for user in users %}
        <div class="card p-2 mb-2">
            <a href="/chat/{{ user[0] }}" class="text-decoration-none">
                💬 Chat with {{ user[0] }}
            </a>
        </div>
    {% endfor %}

    {% if not users %}
        <p>No conversations yet 😔</p>
    {% endif %}
</div>

</body>
</html>
